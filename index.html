<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airspace Radar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    :root {
      --theme-color: #00FF66;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030605;
      color: var(--theme-color);
      font-family: 'SF Mono', 'Roboto Mono', 'Cascadia Code', Consolas, Menlo, monospace;
    }

    #radar-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* Subtle CRT Scanline overlay */
    .scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.25) 50%
      );
      background-size: 100% 4px;
      z-index: 2;
      pointer-events: none;
      opacity: 0.4;
    }

    /* Vignette around canvas for depth */
    .vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.85);
      z-index: 2;
      pointer-events: none;
    }

    /* Live HUD pill */
    #preset-hud {
      position: absolute;
      top: 18px;
      right: 20px;
      z-index: 10;
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(3, 10, 6, 0.82);
      border: 1px solid var(--theme-color);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      opacity: 0.9;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    #preset-hud:hover {
      opacity: 1;
      background: rgba(0, 255, 102, 0.12);
    }

    .hud-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--theme-color);
      box-shadow: 0 0 8px var(--theme-color);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }
  </style>
</head>
<body>

  <canvas id="radar-canvas"></canvas>
  <div class="scanlines"></div>
  <div class="vignette"></div>
  
  <div id="preset-hud" title="Click to cycle airspace location preset">
    <div class="hud-dot"></div>
    <span id="hud-status">RADAR ONLINE</span>
    <span style="opacity: 0.4;">|</span>
    <span id="hud-contacts">SCANNING...</span>
  </div>

<script>
  // Airspace Presets
  const AIRSPACE_PRESETS = [
    { name: "Kathmandu (VNKT)", lat: 27.7172, lon: 85.3240, radius: 80 },
    { name: "London (EGLL)", lat: 51.4700, lon: -0.4543, radius: 65 },
    { name: "New York (KJFK)", lat: 40.6413, lon: -73.7781, radius: 70 },
    { name: "Tokyo (RJTT)", lat: 35.5494, lon: 139.7798, radius: 75 },
    { name: "Dubai (OMDB)", lat: 25.2532, lon: 55.3657, radius: 80 },
    { name: "Singapore (WSSS)", lat: 1.3644, lon: 103.9915, radius: 65 },
    { name: "Frankfurt (EDDF)", lat: 50.0379, lon: 8.5622, radius: 70 },
    { name: "Los Angeles (KLAX)", lat: 33.9416, lon: -118.4085, radius: 75 }
  ];

  // Active Radar Configuration State
  const config = {
    selectedPresetIndex: 0,
    lat: 27.7172,
    lon: 85.3240,
    radiusKm: 80,
    color: '#00FF66',
    showTrails: true,
    showAirports: true,
    sweepSpeed: 0.016
  };

  let isPaused = false;
  let customLat = 27.7172;
  let customLon = 85.3240;

  // Lively Wallpaper Native Property Listener (Declared early to ensure readiness)
  window.livelyPropertyListener = function(name, val) {
    if (val === undefined || val === null) return;
    
    switch (name) {
      case "airspacePreset": {
        const index = typeof val === 'number' ? val : parseInt(val, 10);
        config.selectedPresetIndex = index;
        if (index >= 0 && index < AIRSPACE_PRESETS.length) {
          config.lat = AIRSPACE_PRESETS[index].lat;
          config.lon = AIRSPACE_PRESETS[index].lon;
          config.radiusKm = AIRSPACE_PRESETS[index].radius;
        } else {
          config.lat = customLat;
          config.lon = customLon;
        }
        trackedAircraft.clear();
        break;
      }
      case "lat": {
        const parsed = parseFloat(val);
        if (!isNaN(parsed) && parsed >= -90 && parsed <= 90) {
          customLat = parsed;
          if (config.selectedPresetIndex >= AIRSPACE_PRESETS.length) {
            config.lat = parsed;
            trackedAircraft.clear();
          }
        }
        break;
      }
      case "lon": {
        const parsed = parseFloat(val);
        if (!isNaN(parsed) && parsed >= -180 && parsed <= 180) {
          customLon = parsed;
          if (config.selectedPresetIndex >= AIRSPACE_PRESETS.length) {
            config.lon = parsed;
            trackedAircraft.clear();
          }
        }
        break;
      }
      case "radius": {
        const parsed = parseInt(val, 10);
        if (!isNaN(parsed) && parsed > 0) {
          config.radiusKm = parsed;
        }
        break;
      }
      case "themeColor": {
        applyTheme(val);
        break;
      }
      case "showTrails": {
        config.showTrails = Boolean(val);
        break;
      }
      case "showAirports": {
        config.showAirports = Boolean(val);
        break;
      }
      case "sweepSpeed": {
        const parsed = parseFloat(val);
        if (!isNaN(parsed) && parsed > 0) {
          config.sweepSpeed = parsed / 1000;
        }
        break;
      }
    }

    resize();
    fetchAirports();
    fetchAircraft();
  };

  // Lively Wallpaper Playback State
  window.livelyWallpaperPlaybackChanged = function(data) {
    if (data && typeof data.isPaused === 'boolean') {
      isPaused = data.isPaused;
    }
  };

  // Global Airport Database for zero-latency & standalone local wallpaper fallback
  const BUILTIN_AIRPORTS = [
    { iata: 'LHR', icao: 'EGLL', name: 'London Heathrow', lat: 51.4700, lon: -0.4543 },
    { iata: 'LGW', icao: 'EGKK', name: 'London Gatwick', lat: 51.1537, lon: -0.1821 },
    { iata: 'LCY', icao: 'EGLC', name: 'London City', lat: 51.5048, lon: 0.0495 },
    { iata: 'STN', icao: 'EGSS', name: 'London Stansted', lat: 51.8860, lon: 0.2389 },
    { iata: 'LTN', icao: 'EGGW', name: 'London Luton', lat: 51.8747, lon: -0.3683 },
    { iata: 'JFK', icao: 'KJFK', name: 'John F Kennedy NY', lat: 40.6413, lon: -73.7781 },
    { iata: 'LGA', icao: 'KLGA', name: 'LaGuardia NY', lat: 40.7769, lon: -73.8740 },
    { iata: 'EWR', icao: 'KEWR', name: 'Newark Liberty', lat: 40.6895, lon: -74.1745 },
    { iata: 'LAX', icao: 'KLAX', name: 'Los Angeles Intl', lat: 33.9416, lon: -118.4085 },
    { iata: 'SFO', icao: 'KSFO', name: 'San Francisco Intl', lat: 37.6213, lon: -122.3790 },
    { iata: 'ORD', icao: 'KORD', name: 'Chicago O\'Hare', lat: 41.9742, lon: -87.9073 },
    { iata: 'ATL', icao: 'KATL', name: 'Atlanta Hartsfield', lat: 33.6407, lon: -84.4277 },
    { iata: 'DFW', icao: 'KDFW', name: 'Dallas/Fort Worth', lat: 32.8998, lon: -97.0403 },
    { iata: 'MIA', icao: 'KMIA', name: 'Miami Intl', lat: 25.7959, lon: -80.2870 },
    { iata: 'SEA', icao: 'KSEA', name: 'Seattle-Tacoma', lat: 47.4502, lon: -122.3088 },
    { iata: 'CDG', icao: 'LFPG', name: 'Paris Charles de Gaulle', lat: 49.0097, lon: 2.5479 },
    { iata: 'ORY', icao: 'LFPO', name: 'Paris Orly', lat: 48.7262, lon: 2.3652 },
    { iata: 'FRA', icao: 'EDDF', name: 'Frankfurt Main', lat: 50.0379, lon: 8.5622 },
    { iata: 'MUC', icao: 'EDDM', name: 'Munich Intl', lat: 48.3537, lon: 11.7750 },
    { iata: 'AMS', icao: 'EHAM', name: 'Amsterdam Schiphol', lat: 52.3105, lon: 4.7683 },
    { iata: 'MAD', icao: 'LEMD', name: 'Madrid Barajas', lat: 40.4839, lon: -3.5680 },
    { iata: 'BCN', icao: 'LEBL', name: 'Barcelona El Prat', lat: 41.2974, lon: 2.0833 },
    { iata: 'FCO', icao: 'LIRF', name: 'Rome Fiumicino', lat: 41.8003, lon: 12.2389 },
    { iata: 'ZRH', icao: 'LSZH', name: 'Zurich Intl', lat: 47.4582, lon: 8.5555 },
    { iata: 'VIE', icao: 'LOWW', name: 'Vienna Schwechat', lat: 48.1103, lon: 16.5697 },
    { iata: 'HND', icao: 'RJTT', name: 'Tokyo Haneda', lat: 35.5494, lon: 139.7798 },
    { iata: 'NRT', icao: 'RJAA', name: 'Tokyo Narita', lat: 35.7720, lon: 140.3929 },
    { iata: 'KIX', icao: 'RJBB', name: 'Osaka Kansai', lat: 34.4320, lon: 135.2304 },
    { iata: 'ICN', icao: 'RKSI', name: 'Seoul Incheon', lat: 37.4602, lon: 126.4407 },
    { iata: 'PEK', icao: 'ZBAA', name: 'Beijing Capital', lat: 40.0799, lon: 116.6031 },
    { iata: 'PKX', icao: 'ZBAD', name: 'Beijing Daxing', lat: 39.5098, lon: 116.4105 },
    { iata: 'PVG', icao: 'ZSPD', name: 'Shanghai Pudong', lat: 31.1443, lon: 121.8083 },
    { iata: 'HKG', icao: 'VHHH', name: 'Hong Kong Intl', lat: 22.3080, lon: 113.9185 },
    { iata: 'SIN', icao: 'WSSS', name: 'Singapore Changi', lat: 1.3644, lon: 103.9915 },
    { iata: 'BKK', icao: 'VTBS', name: 'Bangkok Suvarnabhumi', lat: 13.6900, lon: 100.7501 },
    { iata: 'KUL', icao: 'WMKK', name: 'Kuala Lumpur Intl', lat: 2.7456, lon: 101.7099 },
    { iata: 'KTM', icao: 'VNKT', name: 'Kathmandu Tribhuvan', lat: 27.6966, lon: 85.3591 },
    { iata: 'PKR', icao: 'VNPK', name: 'Pokhara Intl', lat: 28.1833, lon: 83.9889 },
    { iata: 'DEL', icao: 'VIDP', name: 'Delhi Indira Gandhi', lat: 28.5562, lon: 77.1000 },
    { iata: 'BOM', icao: 'VABB', name: 'Mumbai Chhatrapati', lat: 19.0896, lon: 72.8656 },
    { iata: 'BLR', icao: 'VOBL', name: 'Bengaluru Kempegowda', lat: 13.1986, lon: 77.7066 },
    { iata: 'DXB', icao: 'OMDB', name: 'Dubai Intl', lat: 25.2532, lon: 55.3657 },
    { iata: 'DOH', icao: 'OTHH', name: 'Doha Hamad', lat: 25.2731, lon: 51.6081 },
    { iata: 'IST', icao: 'LTFM', name: 'Istanbul Airport', lat: 41.2753, lon: 28.7519 },
    { iata: 'SYD', icao: 'YSSY', name: 'Sydney Kingsford Smith', lat: -33.9399, lon: 151.1753 },
    { iata: 'MEL', icao: 'YMML', name: 'Melbourne Tullamarine', lat: -37.6690, lon: 144.8410 },
    { iata: 'GRU', icao: 'SBGR', name: 'Sao Paulo Guarulhos', lat: -23.4356, lon: -46.4731 },
    { iata: 'YYZ', icao: 'CYYZ', name: 'Toronto Pearson', lat: 43.6777, lon: -79.6248 }
  ];

  const canvas = document.getElementById('radar-canvas');
  const ctx = canvas.getContext('2d');
  const hudStatus = document.getElementById('hud-status');
  const hudContacts = document.getElementById('hud-contacts');

  let displayWidth = 0;
  let displayHeight = 0;
  let centerX = 0;
  let centerY = 0;
  let maxRadiusPixel = 0;

  const trackedAircraft = new Map();
  let nearbyAirports = [];
  let sweepAngle = 0;
  let isFetching = false;
  let isFetchingAirports = false;

  function applyTheme(colorInput) {
    if (!colorInput) return;
    if (typeof colorInput === 'string') {
      config.color = colorInput;
    } else if (typeof colorInput === 'object' && colorInput !== null) {
      if (colorInput.value) config.color = colorInput.value;
      else if (colorInput.r !== undefined) config.color = `rgb(${colorInput.r}, ${colorInput.g}, ${colorInput.b})`;
    }
    document.documentElement.style.setProperty('--theme-color', config.color);
  }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    displayWidth = window.innerWidth || document.documentElement.clientWidth || 800;
    displayHeight = window.innerHeight || document.documentElement.clientHeight || 600;

    canvas.width = Math.round(displayWidth * dpr);
    canvas.height = Math.round(displayHeight * dpr);
    canvas.style.width = `${displayWidth}px`;
    canvas.style.height = `${displayHeight}px`;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    centerX = displayWidth / 2;
    centerY = displayHeight / 2;
    maxRadiusPixel = Math.min(displayWidth, displayHeight) * 0.44;

    trackedAircraft.forEach(plane => {
      const pos = gpsToCanvas(plane.latitude, plane.longitude);
      plane.targetX = pos.x;
      plane.targetY = pos.y;
      if (!plane.currX) {
        plane.currX = pos.x;
        plane.currY = pos.y;
      }
    });
  }

  window.addEventListener('resize', resize);
  resize();

  function gpsToCanvas(lat, lon) {
    const latRad = (config.lat * Math.PI) / 180;
    const deltaY_km = (lat - config.lat) * 111.132;
    const deltaX_km = (lon - config.lon) * (111.320 * Math.cos(latRad));
    const scale = maxRadiusPixel / config.radiusKm;
    const distKm = Math.hypot(deltaX_km, deltaY_km);
    const bearingDeg = ((Math.atan2(deltaX_km, deltaY_km) * 180 / Math.PI) + 360) % 360;

    return {
      x: centerX + (deltaX_km * scale),
      y: centerY - (deltaY_km * scale),
      distKm,
      bearingDeg
    };
  }

  function lerp(start, end, amt) {
    return (1 - amt) * start + amt * end;
  }

  function lerpAngle(start, end, amt) {
    let diff = (end - start) % 360;
    if (diff > 180) diff -= 360;
    if (diff < -180) diff += 360;
    return (start + diff * amt + 360) % 360;
  }

  async function fetchAircraft() {
    if (isFetching || isPaused) return;
    isFetching = true;

    try {
      let planeList = null;
      const radiusNm = Math.max(5, Math.round(config.radiusKm * 0.539957));

      // 1. Try local server
      try {
        const response = await fetch(`/api/planes?lat=${config.lat}&lon=${config.lon}&radius=${config.radiusKm}`, {
          headers: { 'Accept': 'application/json' }
        });
        if (response.ok) {
          const data = await response.json();
          if (data && Array.isArray(data.ac)) {
            planeList = data.ac;
          }
        }
      } catch (e) {
        // Fallback for standalone Lively local files
      }

      // 2. Direct Fallback to Public ADS-B APIs
      if (!planeList) {
        const endpoints = [
          `https://api.airplanes.live/v2/point/${config.lat}/${config.lon}/${radiusNm}`,
          `https://api.adsb.lol/v2/lat/${config.lat}/lon/${config.lon}/dist/${radiusNm}`,
          `https://opendata.adsb.fi/api/v2/lat/${config.lat}/lon/${config.lon}/dist/${radiusNm}`
        ];

        for (const ep of endpoints) {
          try {
            const resp = await fetch(ep, { headers: { 'Accept': 'application/json' } });
            if (resp.ok) {
              const d = await resp.json();
              const raw = d.ac || d.aircraft || [];
              if (Array.isArray(raw)) {
                planeList = raw.map((p, idx) => ({
                  hex: (p.hex || p.hexid || `P-${idx}`).trim().toUpperCase(),
                  callsign: (p.flight || p.r || p.call || p.hex || 'UNK').trim().toUpperCase(),
                  model: (p.t || p.desc || p.type || 'AC').trim().toUpperCase(),
                  latitude: typeof p.lat === 'number' ? p.lat : parseFloat(p.lat),
                  longitude: typeof p.lon === 'number' ? p.lon : parseFloat(p.lon),
                  altitudeFt: p.alt_baro === 'ground' ? 0 : (p.alt_baro || p.alt_geom || p.alt || 0),
                  speedKts: Math.round(p.gs || p.speed || 0),
                  heading: Math.round(p.track || p.true_heading || 0),
                  squawk: p.squawk ? String(p.squawk) : null,
                  verticalRate: p.baro_rate || p.geom_rate || 0
                })).filter(p => p.latitude != null && !isNaN(p.latitude) && p.longitude != null && !isNaN(p.longitude));
                break;
              }
            }
          } catch (err) {
            // Try next
          }
        }
      }

      if (planeList && Array.isArray(planeList) && planeList.length > 0) {
        const now = Date.now();

        planeList.forEach(plane => {
          if (plane.latitude == null || plane.longitude == null) return;
          const hex = plane.hex || plane.callsign;
          const targetPos = gpsToCanvas(plane.latitude, plane.longitude);

          if (trackedAircraft.has(hex)) {
            const existing = trackedAircraft.get(hex);
            existing.targetX = targetPos.x;
            existing.targetY = targetPos.y;
            existing.targetHeading = plane.heading || existing.targetHeading;
            existing.speedKts = plane.speedKts;
            existing.altitudeFt = plane.altitudeFt;
            existing.lastSeen = now;
            existing.callsign = plane.callsign || existing.callsign;
            existing.model = plane.model || existing.model;
            existing.latitude = plane.latitude;
            existing.longitude = plane.longitude;

            const lastHist = existing.history[existing.history.length - 1];
            if (!lastHist || Math.hypot(lastHist.x - targetPos.x, lastHist.y - targetPos.y) > 3) {
              existing.history.push({ x: targetPos.x, y: targetPos.y, time: now });
              if (existing.history.length > 12) existing.history.shift();
            }
          } else {
            trackedAircraft.set(hex, {
              hex,
              callsign: plane.callsign || hex,
              model: plane.model || 'AC',
              currX: targetPos.x,
              currY: targetPos.y,
              targetX: targetPos.x,
              targetY: targetPos.y,
              currHeading: plane.heading || 0,
              targetHeading: plane.heading || 0,
              speedKts: plane.speedKts || 0,
              altitudeFt: plane.altitudeFt || 0,
              lastSeen: now,
              blipIntensity: 0.95,
              history: [{ x: targetPos.x, y: targetPos.y, time: now }],
              latitude: plane.latitude,
              longitude: plane.longitude
            });
          }
        });

        trackedAircraft.forEach((val, key) => {
          if (now - val.lastSeen > 35000) {
            trackedAircraft.delete(key);
          }
        });

        hudStatus.textContent = "LIVE ADS-B";
        hudContacts.textContent = `${trackedAircraft.size} CONTACTS`;
      } else if (trackedAircraft.size === 0) {
        hudStatus.textContent = "AIRSPACE SCAN";
        hudContacts.textContent = "0 CONTACTS IN RANGE";
      }
    } catch (err) {
      hudStatus.textContent = "STANDALONE RADAR";
    } finally {
      isFetching = false;
    }
  }

  async function fetchAirports() {
    if (isFetchingAirports || !config.showAirports) return;
    isFetchingAirports = true;

    try {
      let rawAirports = null;

      try {
        const response = await fetch(`/api/airports?lat=${config.lat}&lon=${config.lon}&radius=${config.radiusKm}`, {
          headers: { 'Accept': 'application/json' }
        });
        if (response.ok) {
          const data = await response.json();
          if (data && Array.isArray(data.airports)) {
            rawAirports = data.airports;
          }
        }
      } catch (e) {
        // Fallback
      }

      if (!rawAirports) {
        const latRad = (config.lat * Math.PI) / 180;
        rawAirports = BUILTIN_AIRPORTS.map(apt => {
          const deltaY_km = (apt.lat - config.lat) * 111.132;
          const deltaX_km = (apt.lon - config.lon) * (111.320 * Math.cos(latRad));
          const distKm = Math.hypot(deltaX_km, deltaY_km);
          return { ...apt, distKm };
        }).filter(a => a.distKm <= config.radiusKm * 1.05);
      }

      if (rawAirports && Array.isArray(rawAirports)) {
        nearbyAirports = rawAirports.map(apt => {
          const pos = gpsToCanvas(apt.lat, apt.lon);
          return {
            ...apt,
            x: pos.x,
            y: pos.y,
            distKm: apt.distKm,
            blipIntensity: 0.75
          };
        });
      }
    } catch (err) {
      // Ignored
    } finally {
      isFetchingAirports = false;
    }
  }

  function drawAirports() {
    if (!config.showAirports || !nearbyAirports || nearbyAirports.length === 0) return;

    nearbyAirports.forEach(airport => {
      const pos = gpsToCanvas(airport.lat, airport.lon);
      const dx = pos.x - centerX;
      const dy = pos.y - centerY;
      const pixelDist = Math.hypot(dx, dy);

      if (pixelDist <= maxRadiusPixel + 10) {
        const aptAngle = (Math.atan2(dy, dx) + Math.PI * 2) % (Math.PI * 2);
        let angleDiff = sweepAngle - aptAngle;
        if (angleDiff < 0) angleDiff += Math.PI * 2;
        if (angleDiff < 0.15) {
          airport.blipIntensity = 1.0;
        } else {
          airport.blipIntensity = Math.max(0.40, airport.blipIntensity - 0.0035);
        }

        ctx.save();
        ctx.translate(pos.x, pos.y);
        ctx.globalAlpha = airport.blipIntensity;

        ctx.strokeStyle = config.color;
        ctx.lineWidth = 1.2;

        ctx.beginPath();
        ctx.arc(0, 0, 6.5, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = config.color;
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(0, -9.5); ctx.lineTo(0, -6.5);
        ctx.moveTo(0, 6.5);  ctx.lineTo(0, 9.5);
        ctx.moveTo(-9.5, 0); ctx.lineTo(-6.5, 0);
        ctx.moveTo(6.5, 0);  ctx.lineTo(9.5, 0);
        ctx.stroke();

        const labelX = 12;
        const labelY = -3;
        ctx.textAlign = 'left';
        ctx.font = 'bold 9.5px monospace';
        ctx.fillStyle = config.color;
        ctx.globalAlpha = Math.min(0.95, airport.blipIntensity);
        ctx.fillText(`APT: ${airport.iata || airport.icao} [${airport.name}]`, labelX, labelY);

        ctx.font = '8px monospace';
        ctx.globalAlpha = Math.min(0.70, airport.blipIntensity);
        ctx.fillText(`${airport.icao} • ${airport.distKm.toFixed(1)}KM`, labelX, labelY + 10);

        ctx.restore();
      }
    });
  }

  function drawRadarGrid() {
    ctx.save();

    for (let i = 1; i <= 4; i++) {
      const r = (maxRadiusPixel * i) / 4;
      ctx.beginPath();
      ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
      ctx.strokeStyle = config.color;
      ctx.lineWidth = (i === 4) ? 1.8 : 0.75;
      ctx.globalAlpha = (i === 4) ? 0.45 : 0.18;
      ctx.stroke();

      const ringKm = (config.radiusKm * (i / 4)).toFixed(0);
      ctx.fillStyle = config.color;
      ctx.globalAlpha = 0.55;
      ctx.font = '9px monospace';
      ctx.textAlign = 'left';
      ctx.fillText(`${ringKm}KM`, centerX + 6, centerY - r + 11);
    }

    for (let deg = 0; deg < 360; deg += 30) {
      const rad = (deg * Math.PI) / 180;
      const x2 = centerX + Math.cos(rad) * maxRadiusPixel;
      const y2 = centerY + Math.sin(rad) * maxRadiusPixel;

      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(x2, y2);
      ctx.strokeStyle = config.color;
      ctx.lineWidth = (deg % 90 === 0) ? 1.0 : 0.5;
      ctx.globalAlpha = (deg % 90 === 0) ? 0.28 : 0.12;
      ctx.stroke();

      if (deg % 30 === 0) {
        const compassRad = ((deg - 90) * Math.PI) / 180;
        const tx = centerX + Math.cos(compassRad) * (maxRadiusPixel + 14);
        const ty = centerY + Math.sin(compassRad) * (maxRadiusPixel + 14);

        ctx.fillStyle = config.color;
        ctx.globalAlpha = 0.65;
        ctx.font = '9px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${deg.toString().padStart(3, '0')}°`, tx, ty);
      }
    }

    ctx.font = 'bold 12px monospace';
    ctx.fillStyle = config.color;
    ctx.globalAlpha = 0.9;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('N', centerX, centerY - maxRadiusPixel - 15);
    ctx.fillText('S', centerX, centerY + maxRadiusPixel + 15);
    ctx.fillText('E', centerX + maxRadiusPixel + 15, centerY);
    ctx.fillText('W', centerX - maxRadiusPixel - 15, centerY);

    ctx.globalAlpha = 0.75;
    ctx.beginPath();
    ctx.arc(centerX, centerY, 3, 0, Math.PI * 2);
    ctx.fillStyle = config.color;
    ctx.fill();

    ctx.textAlign = 'center';
    ctx.font = '9.5px monospace';
    ctx.globalAlpha = 0.55;
    ctx.fillText(`CENTER: ${config.lat.toFixed(4)}°N, ${config.lon.toFixed(4)}°E | RADIUS: ${config.radiusKm}KM | CONTACTS: ${trackedAircraft.size} | [CLICK / 'P' FOR PRESETS]`, centerX, displayHeight - 16);

    ctx.restore();
  }

  function drawSweep() {
    ctx.save();

    sweepAngle += config.sweepSpeed;
    if (sweepAngle >= Math.PI * 2) sweepAngle -= Math.PI * 2;

    const trailSpan = 0.48;
    const sweepSegments = 20;

    for (let i = 0; i < sweepSegments; i++) {
      const factor = i / sweepSegments;
      const angleA = sweepAngle - (1 - factor) * trailSpan;
      const angleB = sweepAngle - (1 - (i + 1) / sweepSegments) * trailSpan;

      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.arc(centerX, centerY, maxRadiusPixel, angleA, angleB);
      ctx.closePath();

      ctx.fillStyle = config.color;
      ctx.globalAlpha = factor * factor * 0.12;
      ctx.fill();
    }

    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.lineTo(
      centerX + Math.cos(sweepAngle) * maxRadiusPixel,
      centerY + Math.sin(sweepAngle) * maxRadiusPixel
    );
    ctx.strokeStyle = config.color;
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.restore();
  }

  function drawPlaneIcon(x, y, heading) {
    ctx.save();
    ctx.translate(x, y);

    ctx.rotate((heading * Math.PI) / 180);
    ctx.fillStyle = config.color;

    ctx.beginPath();
    ctx.moveTo(0, -9);
    ctx.lineTo(1.2, -3);
    ctx.lineTo(8, 1.5);
    ctx.lineTo(8, 3);
    ctx.lineTo(1.2, 1);
    ctx.lineTo(1.2, 6.5);
    ctx.lineTo(3.5, 9);
    ctx.lineTo(3.5, 10);
    ctx.lineTo(0, 9);
    ctx.lineTo(-3.5, 10);
    ctx.lineTo(-3.5, 9);
    ctx.lineTo(-1.2, 6.5);
    ctx.lineTo(-1.2, 1);
    ctx.lineTo(-8, 3);
    ctx.lineTo(-8, 1.5);
    ctx.lineTo(-1.2, -3);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function drawAircraft() {
    const LERP_FACTOR = 0.08;

    trackedAircraft.forEach((plane) => {
      plane.currX = lerp(plane.currX, plane.targetX, LERP_FACTOR);
      plane.currY = lerp(plane.currY, plane.targetY, LERP_FACTOR);
      plane.currHeading = lerpAngle(plane.currHeading, plane.targetHeading, LERP_FACTOR);

      const dx = plane.currX - centerX;
      const dy = plane.currY - centerY;
      const pixelDist = Math.hypot(dx, dy);

      if (pixelDist <= maxRadiusPixel + 10) {
        const planeAngle = (Math.atan2(dy, dx) + Math.PI * 2) % (Math.PI * 2);
        let angleDiff = sweepAngle - planeAngle;
        if (angleDiff < 0) angleDiff += Math.PI * 2;

        if (angleDiff < 0.12) {
          plane.blipIntensity = 1.0;
        } else {
          plane.blipIntensity = Math.max(0.42, plane.blipIntensity - 0.0035);
        }

        ctx.save();

        if (config.showTrails && plane.history.length > 1) {
          ctx.beginPath();
          ctx.moveTo(plane.history[0].x, plane.history[0].y);
          for (let i = 1; i < plane.history.length; i++) {
            ctx.lineTo(plane.history[i].x, plane.history[i].y);
          }
          ctx.lineTo(plane.currX, plane.currY);
          ctx.strokeStyle = config.color;
          ctx.lineWidth = 1;
          ctx.setLineDash([2, 4]);
          ctx.globalAlpha = 0.35 * plane.blipIntensity;
          ctx.stroke();
          ctx.setLineDash([]);
        }

        const vectorLen = Math.min(26, Math.max(10, (plane.speedKts || 250) / 20));
        const headingRad = (plane.currHeading * Math.PI) / 180;
        const vecX = plane.currX + Math.sin(headingRad) * vectorLen;
        const vecY = plane.currY - Math.cos(headingRad) * vectorLen;

        ctx.beginPath();
        ctx.moveTo(plane.currX, plane.currY);
        ctx.lineTo(vecX, vecY);
        ctx.strokeStyle = config.color;
        ctx.lineWidth = 1.2;
        ctx.globalAlpha = 0.65 * plane.blipIntensity;
        ctx.stroke();

        ctx.globalAlpha = plane.blipIntensity;
        drawPlaneIcon(plane.currX, plane.currY, plane.currHeading);

        const labelX = plane.currX + 12;
        const labelY = plane.currY - 6;
        const flightNum = plane.callsign || plane.hex || 'UNK';
        const modelName = plane.model || 'AC';
        const altText = plane.altitudeFt > 0 ? `FL${Math.round(plane.altitudeFt / 100)}` : 'GND';
        const speedText = plane.speedKts > 0 ? `${plane.speedKts}KT` : '0KT';

        ctx.textAlign = 'left';
        ctx.font = 'bold 10px monospace';
        ctx.fillStyle = config.color;
        ctx.globalAlpha = Math.min(0.95, plane.blipIntensity);
        ctx.fillText(`${flightNum} [${modelName}]`, labelX, labelY);

        ctx.font = '9px monospace';
        ctx.globalAlpha = Math.min(0.80, plane.blipIntensity);
        ctx.fillText(`${altText} | ${speedText}`, labelX, labelY + 11);

        ctx.restore();
      }
    });
  }

  function render() {
    if (!isPaused) {
      ctx.clearRect(0, 0, displayWidth, displayHeight);

      ctx.fillStyle = '#030605';
      ctx.fillRect(0, 0, displayWidth, displayHeight);

      drawRadarGrid();
      drawAirports();
      drawSweep();
      drawAircraft();
    }

    requestAnimationFrame(render);
  }

  fetchAirports();
  fetchAircraft();
  setInterval(fetchAircraft, 2500);
  requestAnimationFrame(render);

  function cyclePreset() {
    config.selectedPresetIndex = (config.selectedPresetIndex + 1) % AIRSPACE_PRESETS.length;
    const preset = AIRSPACE_PRESETS[config.selectedPresetIndex];
    config.lat = preset.lat;
    config.lon = preset.lon;
    config.radiusKm = preset.radius;
    trackedAircraft.clear();
    resize();
    fetchAirports();
    fetchAircraft();
  }

  window.addEventListener('keydown', (e) => {
    if (e.key === 'p' || e.key === 'P') {
      cyclePreset();
    } else if (e.key === 'c' || e.key === 'C') {
      const colors = ['#00FF66', '#FFB000', '#00E5FF', '#FFFFFF', '#FF3366'];
      const nextColor = colors[(colors.indexOf(config.color) + 1) % colors.length] || '#00FF66';
      applyTheme(nextColor);
    }
  });

  const hudElement = document.getElementById('preset-hud');
  if (hudElement) {
    hudElement.addEventListener('click', cyclePreset);
  }
</script>

</body>
</html>
