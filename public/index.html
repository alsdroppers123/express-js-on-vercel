<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Airspace Radar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000000; font-family: monospace; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
<canvas id="radar"></canvas>

<script>
  const VERCEL_DOMAIN = "https://express-js-on-vercel-tau-silk-13.vercel.app";

  let config = {
    lat: 27.7218,
    lon: 85.3124,
    radiusKm: 50,
    color: '#00FF66'
  };

  const API_INTERVAL_MS = 3000;
  const canvas = document.getElementById('radar');
  const ctx = canvas.getContext('2d');

  let width = 0, height = 0, centerX = 0, centerY = 0, maxRadiusPixel = 0;
  let aircraftList = [];
  let sweepAngle = 0;

  function resize() {
    width = canvas.width = window.innerWidth || 800;
    height = canvas.height = window.innerHeight || 600;
    centerX = width / 2;
    centerY = height / 2;
    maxRadiusPixel = Math.min(width, height) * 0.40;
  }
  window.addEventListener('resize', resize);
  resize();

  function gpsToCanvas(lat, lon) {
    const latRad = config.lat * Math.PI / 180;
    const deltaY_km = (lat - config.lat) * 111.132;
    const deltaX_km = (lon - config.lon) * (111.320 * Math.cos(latRad));
    const scale = maxRadiusPixel / config.radiusKm;
    return {
      x: centerX + (deltaX_km * scale),
      y: centerY - (deltaY_km * scale),
      distKm: Math.hypot(deltaX_km, deltaY_km)
    };
  }

  async function fetchAircraft() {
    const endpoints = [
      `${VERCEL_DOMAIN}/api/planes?lat=${config.lat}&lon=${config.lon}&radius=${config.radiusKm}`,
      `${VERCEL_DOMAIN}/api?lat=${config.lat}&lon=${config.lon}&radius=${config.radiusKm}`,
      `${VERCEL_DOMAIN}/api/index?lat=${config.lat}&lon=${config.lon}&radius=${config.radiusKm}`
    ];

    for (let url of endpoints) {
      try {
        const response = await fetch(url);
        if (!response.ok) continue;

        const data = await response.json();

        if (data && Array.isArray(data.ac)) {
          aircraftList = data.ac.map(plane => ({
            callsign: (plane.flight || plane.r || "UNK").trim(),
            model: (plane.t || "AC").trim().toUpperCase(),
            longitude: plane.lon,
            latitude: plane.lat,
            altitudeFt: plane.alt_baro || plane.alt_geom || 0,
            speedKts: Math.round(plane.gs || 0),
            heading: plane.track || 0
          })).filter(p => p.latitude != null && p.longitude != null);

          break;
        }
      } catch (err) {
        // Silently handle fetch failures without showing overlay UI
      }
    }
  }

  function drawPlaneSilhouette(ctx, x, y, heading) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate((heading * Math.PI) / 180);

    ctx.fillStyle = config.color;

    ctx.beginPath();
    ctx.moveTo(0, -12); ctx.lineTo(1.5, -5); ctx.lineTo(10, 2);
    ctx.lineTo(10, 4.5); ctx.lineTo(1.5, 2); ctx.lineTo(1.5, 9);
    ctx.lineTo(4.5, 12); ctx.lineTo(4.5, 13.5); ctx.lineTo(0, 12);
    ctx.lineTo(-4.5, 13.5); ctx.lineTo(-4.5, 12); ctx.lineTo(-1.5, 9);
    ctx.lineTo(-1.5, 2); ctx.lineTo(-10, 4.5); ctx.lineTo(-10, 2);
    ctx.lineTo(-1.5, -5); ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function drawRadarGrid() {
    ctx.strokeStyle = config.color;
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = 1;

    for (let i = 1; i <= 4; i++) {
      const r = maxRadiusPixel * (i / 4);
      ctx.beginPath();
      ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = config.color;
      ctx.globalAlpha = 0.7;
      ctx.font = '10px monospace';
      ctx.fillText(`${(config.radiusKm * (i / 4)).toFixed(0)} KM`, centerX + 6, centerY - r + 12);
      ctx.globalAlpha = 0.35;
    }

    ctx.beginPath();
    ctx.moveTo(centerX - maxRadiusPixel, centerY); ctx.lineTo(centerX + maxRadiusPixel, centerY);
    ctx.moveTo(centerX, centerY - maxRadiusPixel); ctx.lineTo(centerX, centerY + maxRadiusPixel);
    ctx.stroke();

    ctx.globalAlpha = 1.0;
    ctx.fillStyle = config.color;
    ctx.beginPath();
    ctx.arc(centerX, centerY, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.font = 'bold 12px monospace';
    ctx.fillText('N', centerX - 4, centerY - maxRadiusPixel - 8);
    ctx.fillText('S', centerX - 4, centerY + maxRadiusPixel + 16);
    ctx.fillText('E', centerX + maxRadiusPixel + 8, centerY + 4);
    ctx.fillText('W', centerX - maxRadiusPixel - 20, centerY + 4);
  }

  function drawSweep() {
    sweepAngle += 0.015;
    if (sweepAngle >= Math.PI * 2) sweepAngle = 0;

    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.lineTo(centerX + Math.cos(sweepAngle) * maxRadiusPixel, centerY + Math.sin(sweepAngle) * maxRadiusPixel);
    ctx.strokeStyle = config.color;
    ctx.globalAlpha = 1.0;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  function drawAircraft() {
    aircraftList.forEach(plane => {
      const pos = gpsToCanvas(plane.latitude, plane.longitude);

      if (pos.distKm <= config.radiusKm) {
        drawPlaneSilhouette(ctx, pos.x, pos.y, plane.heading);

        const labelX = pos.x + 14;
        const labelY = pos.y - 6;

        ctx.globalAlpha = 1.0;
        ctx.fillStyle = config.color;
        ctx.font = 'bold 11px monospace';
        ctx.fillText(`${plane.callsign} [${plane.model}]`, labelX, labelY);

        ctx.globalAlpha = 0.8;
        ctx.font = '10px monospace';
        ctx.fillText(`ALT: ${plane.altitudeFt}FT | ${plane.speedKts}KTS`, labelX, labelY + 12);
        ctx.globalAlpha = 1.0;
      }
    });
  }

  function render() {
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, width, height);

    drawRadarGrid();
    drawSweep();
    drawAircraft();

    requestAnimationFrame(render);
  }

  fetchAircraft();
  setInterval(fetchAircraft, API_INTERVAL_MS);
  render();

  window.livelyPropertyListener = function(name, val) {
    switch (name) {
      case "lat": config.lat = parseFloat(val) || config.lat; break;
      case "lon": config.lon = parseFloat(val) || config.lon; break;
      case "radius": config.radiusKm = parseInt(val) || config.radiusKm; break;
      case "themeColor": config.color = val; break;
    }
    fetchAircraft();
  };
</script>
</body>
</html>
