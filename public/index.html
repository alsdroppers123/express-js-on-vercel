<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airspace Radar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    :root {
      --theme-color: #00FF66;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030605;
      color: var(--theme-color);
      font-family: 'SF Mono', 'Roboto Mono', 'Cascadia Code', Consolas, Menlo, monospace;
      pointer-events: none;
    }

    #radar-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      pointer-events: none;
    }

    /* Subtle CRT Scanline overlay */
    .scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.28) 50%
      );
      background-size: 100% 4px;
      z-index: 2;
      pointer-events: none;
      opacity: 0.45;
    }

    /* Vignette around canvas for depth */
    .vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.85);
      z-index: 2;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <canvas id="radar-canvas"></canvas>
  <div class="scanlines"></div>
  <div class="vignette"></div>

<script>
  // Wallpaper Configuration State
  const config = {
    lat: 51.51477,
    lon: -0.12842,
    radiusKm: 50,
    color: '#00FF66',
    showTrails: true
  };

  const canvas = document.getElementById('radar-canvas');
  const ctx = canvas.getContext('2d');

  let displayWidth = 0;
  let displayHeight = 0;
  let centerX = 0;
  let centerY = 0;
  let maxRadiusPixel = 0;

  // Aircraft Map for Smooth Interpolation
  const trackedAircraft = new Map();
  let nearbyAirports = [];

  // Sweep Animation Variables
  let sweepAngle = 0;
  const SWEEP_SPEED = 0.016; // smooth rotation speed
  let isFetching = false;
  let isFetchingAirports = false;

  // Theme apply
  function applyTheme(hexColor) {
    if (!hexColor) return;
    config.color = hexColor;
    document.documentElement.style.setProperty('--theme-color', hexColor);
  }

  // Handle Canvas Resize with pixel-perfect aspect ratio
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    displayWidth = window.innerWidth || document.documentElement.clientWidth || 800;
    displayHeight = window.innerHeight || document.documentElement.clientHeight || 600;

    // Allocate high-DPI buffer
    canvas.width = Math.round(displayWidth * dpr);
    canvas.height = Math.round(displayHeight * dpr);
    canvas.style.width = `${displayWidth}px`;
    canvas.style.height = `${displayHeight}px`;

    // Map 1 unit to 1 CSS pixel without distortion
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    centerX = displayWidth / 2;
    centerY = displayHeight / 2;
    // Keep perfectly circular radar scope based on the shortest viewport dimension
    maxRadiusPixel = Math.min(displayWidth, displayHeight) * 0.44;

    // Recalculate target positions
    trackedAircraft.forEach(plane => {
      const pos = gpsToCanvas(plane.latitude, plane.longitude);
      plane.targetX = pos.x;
      plane.targetY = pos.y;
      if (!plane.currX) {
        plane.currX = pos.x;
        plane.currY = pos.y;
      }
    });
  }

  window.addEventListener('resize', resize);
  resize();

  // Convert GPS (lat, lon) to Canvas coordinate (x, y) relative to radar center
  function gpsToCanvas(lat, lon) {
    const latRad = config.lat * Math.PI / 180;
    const deltaY_km = (lat - config.lat) * 111.132;
    const deltaX_km = (lon - config.lon) * (111.320 * Math.cos(latRad));
    const scale = maxRadiusPixel / config.radiusKm;
    const distKm = Math.hypot(deltaX_km, deltaY_km);
    const bearingDeg = ((Math.atan2(deltaX_km, deltaY_km) * 180 / Math.PI) + 360) % 360;

    return {
      x: centerX + (deltaX_km * scale),
      y: centerY - (deltaY_km * scale),
      distKm,
      bearingDeg
    };
  }

  // Linear Interpolation
  function lerp(start, end, amt) {
    return (1 - amt) * start + amt * end;
  }

  // Heading shortest-angle lerp
  function lerpAngle(start, end, amt) {
    let diff = (end - start) % 360;
    if (diff > 180) diff -= 360;
    if (diff < -180) diff += 360;
    return (start + diff * amt + 360) % 360;
  }

  // Fast Backend Polling
  async function fetchAircraft() {
    if (isFetching) return;
    isFetching = true;

    try {
      const response = await fetch(`/api/planes?lat=${config.lat}&lon=${config.lon}&radius=${config.radiusKm}`, {
        headers: { 'Accept': 'application/json' }
      });

      if (!response.ok) throw new Error(`HTTP ${response.status}`);

      const data = await response.json();

      if (data && Array.isArray(data.ac)) {
        const now = Date.now();

        data.ac.forEach(plane => {
          if (plane.latitude == null || plane.longitude == null) return;
          const hex = plane.hex || plane.callsign;

          const targetPos = gpsToCanvas(plane.latitude, plane.longitude);

          if (trackedAircraft.has(hex)) {
            const existing = trackedAircraft.get(hex);
            existing.targetX = targetPos.x;
            existing.targetY = targetPos.y;
            existing.targetHeading = plane.heading || existing.targetHeading || 0;
            existing.distKm = targetPos.distKm;
            existing.bearingDeg = targetPos.bearingDeg;
            existing.speedKts = plane.speedKts;
            existing.altitudeFt = plane.altitudeFt;
            existing.model = plane.model;
            existing.callsign = plane.callsign;
            existing.squawk = plane.squawk;
            existing.verticalRate = plane.verticalRate;
            existing.lastSeen = now;
            existing.latitude = plane.latitude;
            existing.longitude = plane.longitude;

            // Add history breadcrumb if plane moved
            const lastHist = existing.history[existing.history.length - 1];
            if (!lastHist || Math.hypot(lastHist.x - targetPos.x, lastHist.y - targetPos.y) > 3) {
              existing.history.push({ x: targetPos.x, y: targetPos.y, time: now });
              if (existing.history.length > 10) existing.history.shift();
            }
          } else {
            trackedAircraft.set(hex, {
              hex,
              callsign: plane.callsign,
              model: plane.model,
              latitude: plane.latitude,
              longitude: plane.longitude,
              currX: targetPos.x,
              currY: targetPos.y,
              targetX: targetPos.x,
              targetY: targetPos.y,
              currHeading: plane.heading || 0,
              targetHeading: plane.heading || 0,
              altitudeFt: plane.altitudeFt,
              speedKts: plane.speedKts,
              squawk: plane.squawk,
              verticalRate: plane.verticalRate,
              distKm: targetPos.distKm,
              bearingDeg: targetPos.bearingDeg,
              lastSeen: now,
              blipIntensity: 0.7,
              history: [{ x: targetPos.x, y: targetPos.y, time: now }]
            });
          }
        });

        // Prune stale contacts
        trackedAircraft.forEach((plane, hex) => {
          if (now - plane.lastSeen > 20000) {
            trackedAircraft.delete(hex);
          }
        });
      }
    } catch (err) {
      // Quiet failover
    } finally {
      isFetching = false;
    }
  }

  // Fetch Nearby Airports
  async function fetchAirports() {
    if (isFetchingAirports) return;
    isFetchingAirports = true;

    try {
      const response = await fetch(`/api/airports?lat=${config.lat}&lon=${config.lon}&radius=${config.radiusKm}`, {
        headers: { 'Accept': 'application/json' }
      });

      if (!response.ok) throw new Error(`HTTP ${response.status}`);

      const data = await response.json();
      if (data && Array.isArray(data.airports)) {
        nearbyAirports = data.airports.map(apt => {
          const pos = gpsToCanvas(apt.lat, apt.lon);
          return {
            ...apt,
            x: pos.x,
            y: pos.y,
            distKm: pos.distKm,
            blipIntensity: 0.75
          };
        });
      }
    } catch (err) {
      // Quiet failover
    } finally {
      isFetchingAirports = false;
    }
  }

  // Draw Airport Symbols on Radar
  function drawAirports() {
    if (!nearbyAirports || nearbyAirports.length === 0) return;

    nearbyAirports.forEach(airport => {
      const pos = gpsToCanvas(airport.lat, airport.lon);
      const dx = pos.x - centerX;
      const dy = pos.y - centerY;
      const pixelDist = Math.hypot(dx, dy);

      if (pixelDist <= maxRadiusPixel + 10) {
        // Phosphor sweep illumination for airport beacon
        const aptAngle = (Math.atan2(dy, dx) + Math.PI * 2) % (Math.PI * 2);
        let angleDiff = sweepAngle - aptAngle;
        if (angleDiff < 0) angleDiff += Math.PI * 2;

        if (angleDiff < 0.2) {
          airport.blipIntensity = 1.0;
        } else {
          airport.blipIntensity = Math.max(0.70, (airport.blipIntensity || 0.70) - 0.002);
        }

        ctx.save();
        ctx.translate(pos.x, pos.y);
        ctx.globalAlpha = airport.blipIntensity;

        // 1. Dual-Ring Airport Symbol with 4-way Cross Ticks
        ctx.strokeStyle = config.color;
        ctx.lineWidth = 1.2;

        // Outer Ring
        ctx.beginPath();
        ctx.arc(0, 0, 6.5, 0, Math.PI * 2);
        ctx.stroke();

        // Inner Circle
        ctx.beginPath();
        ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = config.color;
        ctx.fill();

        // Cross Ticks (N, S, E, W marks on the airport symbol)
        ctx.beginPath();
        ctx.moveTo(0, -9.5); ctx.lineTo(0, -6.5);
        ctx.moveTo(0, 6.5);  ctx.lineTo(0, 9.5);
        ctx.moveTo(-9.5, 0); ctx.lineTo(-6.5, 0);
        ctx.moveTo(6.5, 0);  ctx.lineTo(9.5, 0);
        ctx.stroke();

        // 2. Airport Label
        const labelX = 12;
        const labelY = -3;
        ctx.textAlign = 'left';

        // Primary ICAO / IATA Code & Name
        ctx.font = 'bold 9.5px monospace';
        ctx.fillStyle = config.color;
        ctx.globalAlpha = Math.min(0.95, airport.blipIntensity);
        ctx.fillText(`⊘ [${airport.iata}] ${airport.name}`, labelX, labelY);

        // Subtitle ICAO & Distance
        ctx.font = '8px monospace';
        ctx.globalAlpha = Math.min(0.70, airport.blipIntensity);
        ctx.fillText(`${airport.icao} • ${airport.distKm.toFixed(1)}KM`, labelX, labelY + 10);

        ctx.restore();
      }
    });
  }

  // Draw Aesthetic Radar Scope Geometry
  function drawRadarGrid() {
    ctx.save();
    ctx.strokeStyle = config.color;
    ctx.lineWidth = 1;

    // Concentric Range Rings (4 rings)
    for (let i = 1; i <= 4; i++) {
      const r = maxRadiusPixel * (i / 4);
      ctx.beginPath();
      ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
      ctx.globalAlpha = (i === 4) ? 0.45 : 0.18;
      ctx.stroke();

      // Range Labels on vertical axis
      const ringKm = (config.radiusKm * (i / 4)).toFixed(0);
      ctx.fillStyle = config.color;
      ctx.globalAlpha = 0.55;
      ctx.font = '9px monospace';
      ctx.fillText(`${ringKm}KM`, centerX + 6, centerY - r + 11);
    }

    // Radial Azimuth Spoke Lines (every 30 degrees)
    for (let deg = 0; deg < 360; deg += 30) {
      const rad = (deg * Math.PI) / 180;
      const isCard = (deg % 90 === 0);

      ctx.beginPath();
      const startR = isCard ? 0 : maxRadiusPixel * 0.20;
      ctx.moveTo(centerX + Math.cos(rad) * startR, centerY + Math.sin(rad) * startR);
      ctx.lineTo(centerX + Math.cos(rad) * maxRadiusPixel, centerY + Math.sin(rad) * maxRadiusPixel);
      ctx.globalAlpha = isCard ? 0.35 : 0.10;
      ctx.stroke();

      if (!isCard) {
        ctx.fillStyle = config.color;
        ctx.globalAlpha = 0.4;
        ctx.font = '8px monospace';
        const labelR = maxRadiusPixel + 12;
        const textX = centerX + Math.cos(rad) * labelR;
        const textY = centerY + Math.sin(rad) * labelR + 3;
        ctx.textAlign = 'center';
        ctx.fillText(`${deg}°`, textX, textY);
      }
    }

    // Cardinal Points (N, S, E, W)
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 11px monospace';
    ctx.fillStyle = config.color;
    ctx.globalAlpha = 0.85;

    ctx.fillText('N', centerX, centerY - maxRadiusPixel - 12);
    ctx.fillText('S', centerX, centerY + maxRadiusPixel + 12);
    ctx.fillText('E', centerX + maxRadiusPixel + 15, centerY);
    ctx.fillText('W', centerX - maxRadiusPixel - 15, centerY);

    // Center Origin Point
    ctx.globalAlpha = 0.75;
    ctx.beginPath();
    ctx.arc(centerX, centerY, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // Draw Sweeping Radar Beam with Phosphor Gradient Fan
  function drawSweep() {
    ctx.save();

    sweepAngle += SWEEP_SPEED;
    if (sweepAngle >= Math.PI * 2) sweepAngle -= Math.PI * 2;

    const trailSpan = 0.48; // ~28 degrees phosphor fan
    const sweepSegments = 20;

    for (let i = 0; i < sweepSegments; i++) {
      const factor = i / sweepSegments;
      const angleA = sweepAngle - (1 - factor) * trailSpan;
      const angleB = sweepAngle - (1 - (i + 1) / sweepSegments) * trailSpan;

      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.arc(centerX, centerY, maxRadiusPixel, angleA, angleB);
      ctx.closePath();

      ctx.fillStyle = config.color;
      ctx.globalAlpha = factor * factor * 0.12;
      ctx.fill();
    }

    // Primary Scanning Ray
    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.lineTo(
      centerX + Math.cos(sweepAngle) * maxRadiusPixel,
      centerY + Math.sin(sweepAngle) * maxRadiusPixel
    );
    ctx.strokeStyle = config.color;
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.restore();
  }

  // Draw Aerodynamic Aircraft Icon
  function drawPlaneIcon(x, y, heading) {
    ctx.save();
    ctx.translate(x, y);

    // Rotate for Plane Direction
    ctx.rotate((heading * Math.PI) / 180);
    ctx.fillStyle = config.color;

    // Aircraft Silhouette
    ctx.beginPath();
    ctx.moveTo(0, -9);
    ctx.lineTo(1.2, -3);
    ctx.lineTo(8, 1.5);
    ctx.lineTo(8, 3);
    ctx.lineTo(1.2, 1);
    ctx.lineTo(1.2, 6.5);
    ctx.lineTo(3.5, 9);
    ctx.lineTo(3.5, 10);
    ctx.lineTo(0, 9);
    ctx.lineTo(-3.5, 10);
    ctx.lineTo(-3.5, 9);
    ctx.lineTo(-1.2, 6.5);
    ctx.lineTo(-1.2, 1);
    ctx.lineTo(-8, 3);
    ctx.lineTo(-8, 1.5);
    ctx.lineTo(-1.2, -3);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  // Draw Aircraft on Canvas with model, flight number, altitude, and speed labels
  function drawAircraft() {
    const LERP_FACTOR = 0.08;

    trackedAircraft.forEach((plane) => {
      // Smooth interpolation
      plane.currX = lerp(plane.currX, plane.targetX, LERP_FACTOR);
      plane.currY = lerp(plane.currY, plane.targetY, LERP_FACTOR);
      plane.currHeading = lerpAngle(plane.currHeading, plane.targetHeading, LERP_FACTOR);

      const dx = plane.currX - centerX;
      const dy = plane.currY - centerY;
      const pixelDist = Math.hypot(dx, dy);

      if (pixelDist <= maxRadiusPixel + 10) {
        // Phosphor sweep illumination
        const planeAngle = (Math.atan2(dy, dx) + Math.PI * 2) % (Math.PI * 2);
        let angleDiff = sweepAngle - planeAngle;
        if (angleDiff < 0) angleDiff += Math.PI * 2;

        if (angleDiff < 0.2) {
          plane.blipIntensity = 1.0;
        } else {
          plane.blipIntensity = Math.max(0.65, plane.blipIntensity - 0.003);
        }

        // Historical Path Trail (Clean Dots)
        if (config.showTrails && plane.history && plane.history.length > 1) {
          ctx.save();
          ctx.fillStyle = config.color;
          for (let i = 0; i < plane.history.length - 1; i++) {
            const hist = plane.history[i];
            const trailAlpha = (i + 1) / plane.history.length * 0.22;
            ctx.globalAlpha = trailAlpha;
            ctx.beginPath();
            ctx.arc(hist.x, hist.y, 1.2, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        // Draw Plane Icon
        ctx.save();
        ctx.globalAlpha = plane.blipIntensity;
        drawPlaneIcon(plane.currX, plane.currY, plane.currHeading);

        // Aircraft In-Situ Data Tag
        const labelX = plane.currX + 13;
        const labelY = plane.currY - 7;
        const vSymbol = plane.verticalRate > 250 ? ' ▲' : plane.verticalRate < -250 ? ' ▼' : '';
        const altText = `${Math.round(plane.altitudeFt).toLocaleString()}FT${vSymbol}`;
        const speedText = `${plane.speedKts}KT`;
        const flightNum = plane.callsign || 'UNK';
        const modelName = plane.model || 'AC';

        // Flight Number & Model
        ctx.textAlign = 'left';
        ctx.font = 'bold 10px monospace';
        ctx.fillStyle = config.color;
        ctx.globalAlpha = Math.min(0.95, plane.blipIntensity);
        ctx.fillText(`${flightNum} [${modelName}]`, labelX, labelY);

        // Altitude & Speed
        ctx.font = '9px monospace';
        ctx.globalAlpha = Math.min(0.80, plane.blipIntensity);
        ctx.fillText(`${altText} | ${speedText}`, labelX, labelY + 11);

        ctx.restore();
      }
    });
  }

  // 60FPS Render Loop
  function render() {
    ctx.clearRect(0, 0, displayWidth, displayHeight);

    // Deep Radar Dark Canvas
    ctx.fillStyle = '#030605';
    ctx.fillRect(0, 0, displayWidth, displayHeight);

    drawRadarGrid();
    drawAirports();
    drawSweep();
    drawAircraft();

    requestAnimationFrame(render);
  }

  // Initial Fetch & Regular Polling
  fetchAirports();
  fetchAircraft();
  setInterval(fetchAircraft, 2500);
  requestAnimationFrame(render);

  // Lively Wallpaper Native Property Listener
  window.livelyPropertyListener = function(name, val) {
    switch (name) {
      case "lat": 
        config.lat = parseFloat(val) || config.lat; 
        break;
      case "lon": 
        config.lon = parseFloat(val) || config.lon; 
        break;
      case "radius": 
        config.radiusKm = parseInt(val) || config.radiusKm; 
        break;
      case "themeColor": 
        applyTheme(val); 
        break;
    }
    resize();
    fetchAirports();
    fetchAircraft();
  };
</script>

</body>
</html>
